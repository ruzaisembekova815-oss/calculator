<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tax Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Tax Calculator</h1>
        <div class="form-group">
            <label for="income">Enter Income ($):</label>
            <input type="number" id="income" placeholder="e.g. 50000">
        </div>
        <div class="form-group">
            <label for="taxRate">Enter Tax Rate (%):</label>
            <input type="number" id="taxRate" placeholder="e.g. 15">
        </div>
        <button id="calculateBtn">Calculate Tax</button>
        <div class="result" id="result"></div>
    </div>
    <script src="taxCalculator.js"></script>
    <script src="script.js"></script>
</body>
</html>
